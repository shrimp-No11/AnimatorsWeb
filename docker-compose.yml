
services:
  webapp:
    build:
      context: ./AnimatorsWeb
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./AnimatorsWeb/wwwroot/images:/app/wwwroot/images
      - ./AnimatorsWeb/wwwroot/featured:/app/wwwroot/featured
      - ./AnimatorsWeb/wwwroot/uploads:/app/wwwroot/uploads
      - ./AnimatorsWeb/wwwroot/rules:/app/wwwroot/rules
      - ./dp-keys:/root/.aspnet/DataProtection-Keys
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=animators_db;Username=animators_user;Password=${DB_PASSWORD}
      - Discord__BotToken=${DISCORD_BOT_TOKEN}
      - Discord__ClientId=${DISCORD_CLIENT_ID}
      - Discord__ClientSecret=${DISCORD_CLIENT_SECRET}
      - Discord__InviteUrl=${DISCORD_INVITE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 900M

  db:
    image: postgres:17-alpine
  # ports:
  #   - "5433:5432"
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c work_mem=4MB
    restart: unless-stopped
    environment:
      - POSTGRES_DB=animators_db
      - POSTGRES_USER=animators_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animators_user -d animators_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 350M
volumes:
  postgres_data: